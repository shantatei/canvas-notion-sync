name: Daily Canvas -> Notion sync

on:
  schedule:
    # 00:07 UTC = 08:07 Singapore time (no DST in SGT, so this stays fixed).
    # Deliberately NOT on the hour: GitHub's scheduler is most congested at
    # exact hour marks (worst of all: midnight UTC, the most popular "once
    # a day" cron time on all of GitHub) and can delay or drop runs there.
    - cron: "7 0 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/sync.py
        env:
          CANVAS_URL: ${{ secrets.CANVAS_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_ANNOUNCEMENTS_DATA_SOURCE_ID: ${{ secrets.NOTION_ANNOUNCEMENTS_DATA_SOURCE_ID }}
